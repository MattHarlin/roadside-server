<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Estimate Calculator</title>

<link rel="stylesheet" href="/admin.css">

<style>
.container {
  max-width: 600px;
  margin: auto;
  padding: 20px;
}

input, select {
  width: 100%;
  padding: 12px;
  margin: 10px 0;
}

button {
  width: 100%;
  padding: 12px;
  cursor: pointer;
  margin-top: 10px;
}

.result {
  margin-top: 20px;
  font-size: 22px;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<h1>Job Estimate Calculator</h1>

<!-- VIN (future use) -->
<input id="vin" placeholder="VIN (optional)" />
<button onclick="decodeVIN()">Decode VIN (coming soon)</button>

<hr>

<!-- Year / Make / Model -->
<select id="year">
  <option value="">Select Year</option>
</select>

<select id="make">
  <option value="">Select Make</option>
</select>

<select id="model">
  <option value="">Select Model</option>
</select>

<hr>

<!-- Service -->
<select id="service">
  <option value="50">Battery Boost - $50</option>
  <option value="75">Flat Tire - $75</option>
  <option value="100">Towing - $100</option>
  <option value="65">Fuel Delivery - $65</option>
</select>

<!-- Distance -->
<input type="number" id="distance" placeholder="Distance (miles)" />

<button onclick="calculate()">Calculate Estimate</button>

<div class="result" id="result"></div>

</div>

<script>
/* ---------------- YEAR DROPDOWN ---------------- */
const yearSelect = document.getElementById("year");

for (let y = 2026; y >= 1980; y--) {
  const opt = document.createElement("option");
  opt.value = y;
  opt.textContent = y;
  yearSelect.appendChild(opt);
}

/* ---------------- MAKE (REAL API) ---------------- */
const makeSelect = document.getElementById("make");

async function loadMakes() {
  try {
    const res = await fetch(
      "https://vpic.nhtsa.dot.gov/api/vehicles/GetAllMakes?format=json"
    );

    const data = await res.json();

    data.Results.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.Make_Name;
      opt.textContent = item.Make_Name;
      makeSelect.appendChild(opt);
    });

  } catch (err) {
    console.error("Error loading makes:", err);
  }
}

/* ---------------- MODEL (MAKE + YEAR) ---------------- */
const modelSelect = document.getElementById("model");

async function loadModels() {

  const make = makeSelect.value;
  const year = yearSelect.value;

  if (!make || !year) return;

  try {
    const res = await fetch(
      `https://vpic.nhtsa.dot.gov/api/vehicles/GetModelsForMakeYear/make/${make}/modelyear/${year}?format=json`
    );

    const data = await res.json();

    modelSelect.innerHTML = '<option value="">Select Model</option>';

    data.Results.forEach(item => {
      const opt = document.createElement("option");
      opt.value = item.Model_Name;
      opt.textContent = item.Model_Name;
      modelSelect.appendChild(opt);
    });

  } catch (err) {
    console.error("Error loading models:", err);
  }
}

/* ---------------- EVENT LISTENERS ---------------- */
makeSelect.addEventListener("change", loadModels);
yearSelect.addEventListener("change", loadModels);

/* ---------------- ESTIMATE LOGIC ---------------- */
function calculate() {

  const service = parseFloat(document.getElementById("service").value);
  const distance = parseFloat(document.getElementById("distance").value) || 0;
  const year = parseInt(document.getElementById("year").value) || 0;
  const make = document.getElementById("make").value;

  let total = service;

  // distance
  total += distance * 3;

  // age
  const age = 2026 - year;
  if (age > 15) total += 40;
  else if (age > 10) total += 20;

  // luxury brands
  const luxury = ["bmw", "mercedes", "audi", "tesla"];
  if (luxury.includes(make.toLowerCase())) {
    total += 35;
  }

  document.getElementById("result").innerText =
    "Estimated Price: $" + total.toFixed(2);
}

/* ---------------- VIN PLACEHOLDER ---------------- */
function decodeVIN() {
  alert("VIN decoding will be added in next step (Step 3)");
}

/* ---------------- INIT ---------------- */
loadMakes();
</script>

</body>
</html>
