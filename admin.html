<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Roadside Assistance</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Roadside Assistance</h1>

  <!-- ================= REQUEST FORM ================= -->
  <div class="container">

    <h2>Request Help</h2>

    <input id="name" placeholder="Your Name" />
    <input id="issue" placeholder="What’s the problem?" />

    <button onclick="sendRequest()">Request Help</button>

    <p id="status"></p>

  </div>

  <!-- ================= MAP SECTION ================= -->
  <h2>Your Location</h2>
  <div id="map"></div>

  <script>
    // Try GPS map
    navigator.geolocation.getCurrentPosition((pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;

      document.getElementById("map").innerHTML = `
        <iframe
          width="100%"
          height="300"
          style="border:0"
          loading="lazy"
          src="https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed">
        </iframe>
      `;
    }, () => {
      // fallback if blocked
      document.getElementById("map").innerHTML =
        "<p>Location access denied. Enable GPS to see map.</p>";
    });
  </script>

  <!-- ================= BACKEND CONNECTION ================= -->
  <script>
    const API = "https://roadside-server.onrender.com";

    async function sendRequest() {
      const name = document.getElementById("name").value;
      const issue = document.getElementById("issue").value;

      if (!name || !issue) {
        document.getElementById("status").innerText = "Please fill all fields";
        return;
      }

      try {
        const res = await fetch(`${API}/request`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ name, issue })
        });

        await res.json();

        document.getElementById("status").innerText =
          "Request sent successfully!";

        document.getElementById("name").value = "";
        document.getElementById("issue").value = "";

      } catch (err) {
        console.error(err);
        document.getElementById("status").innerText =
          "Error sending request";
      }
    }
  </script>

  <!-- ================= TAWK CHAT ================= -->
  <script type="text/javascript">
    var Tawk_API = Tawk_API || {}, Tawk_LoadStart = new Date();
    (function(){
      var s1 = document.createElement("script"),
          s0 = document.getElementsByTagName("script")[0];

      s1.async = true;
      s1.src = 'https://embed.tawk.to/YOUR_TAWK_ID/DEFAULT';
      s1.charset = 'UTF-8';
      s1.setAttribute('crossorigin','*');

      s0.parentNode.insertBefore(s1, s0);
    })();
  </script>

</body>
</html>
